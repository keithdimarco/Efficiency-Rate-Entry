<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Pippin Rd — Rate Entry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#ECEEF1;
    --card:#FFFFFF;
    --ink:#1C2024;
    --ink-soft:#5B636B;
    --line:#D7DBDF;
    --amber:#E09A2C;
    --amber-deep:#B5791C;
    --red:#C4483C;
    --green:#3E7D5A;
    --radius:3px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans',sans-serif;
    min-height:100vh;
    padding-bottom:90px;
  }
  h1,h2,h3{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:600;
    letter-spacing:0.01em;
    margin:0;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}

  /* ---- Header ---- */
  header{
    position:sticky; top:0; z-index:20;
    background:var(--ink);
    color:#fff;
    padding:14px 16px 12px;
    border-bottom:3px solid var(--amber);
  }
  header .top-row{
    display:flex; align-items:baseline; justify-content:space-between;
    gap:10px;
  }
  header h1{font-size:22px; color:#fff; line-height:1;}
  header .plant{
    font-size:12px; color:#B9C0C6; text-transform:uppercase; letter-spacing:0.08em;
    margin-top:2px;
  }
  .date-nav{
    display:flex; align-items:center; gap:6px;
  }
  .date-nav button{
    background:#2B3138; border:1px solid #444C54; color:#fff;
    width:30px; height:30px; border-radius:var(--radius);
    font-size:16px; cursor:pointer; line-height:1;
  }
  .date-nav button:active{background:var(--amber); color:#1C2024;}
  .date-nav input[type=date]{
    background:#2B3138; border:1px solid #444C54; color:#fff;
    font-family:'IBM Plex Mono',monospace; font-size:13px;
    padding:6px 8px; border-radius:var(--radius);
  }
  .progress-row{
    display:flex; align-items:center; gap:10px;
    margin-top:12px;
  }
  .progress-track{
    flex:1; height:8px; background:#2B3138; border-radius:99px; overflow:hidden;
  }
  .progress-fill{
    height:100%; background:var(--amber); width:0%;
    transition:width .25s ease;
  }
  .progress-label{
    font-family:'IBM Plex Mono',monospace; font-size:12px; color:#D9DEE2; white-space:nowrap;
  }

  /* ---- Controls ---- */
  .controls{
    padding:12px 16px 8px;
    display:flex; gap:8px; flex-wrap:wrap;
  }
  .search-box{
    flex:1 1 180px; position:relative;
  }
  .search-box input{
    width:100%; padding:10px 12px; font-size:15px;
    border:1px solid var(--line); border-radius:var(--radius);
    background:var(--card); color:var(--ink);
    font-family:'IBM Plex Sans',sans-serif;
  }
  select.shop-filter{
    padding:10px 10px; font-size:14px;
    border:1px solid var(--line); border-radius:var(--radius);
    background:var(--card); color:var(--ink);
    font-family:'IBM Plex Sans',sans-serif;
  }
  .who-row{
    padding:0 16px 10px; display:flex; align-items:center; gap:8px;
  }
  .who-row label{font-size:12px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em;}
  .who-row input{
    border:1px solid var(--line); border-radius:var(--radius); padding:6px 8px;
    font-family:'IBM Plex Mono',monospace; font-size:13px; width:90px; background:var(--card); color:var(--ink);
    text-transform:uppercase;
  }

  /* ---- Tabs ---- */
  .tabs{
    display:flex; gap:0; margin:0 16px 10px; border-bottom:1px solid var(--line);
  }
  .tab-btn{
    background:none; border:none; font-family:'Barlow Condensed',sans-serif;
    font-size:17px; font-weight:600; color:var(--ink-soft);
    padding:8px 4px; margin-right:22px; cursor:pointer; letter-spacing:.02em;
    border-bottom:3px solid transparent;
  }
  .tab-btn.active{color:var(--ink); border-bottom-color:var(--amber);}

  /* ---- Roster list ---- */
  .list{padding:0 16px;}
  .emp-card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    margin-bottom:8px; overflow:hidden;
  }
  .emp-row{
    display:flex; align-items:center; gap:12px;
    padding:12px 14px; cursor:pointer;
  }
  .emp-id{
    font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft);
    width:44px; flex:0 0 auto;
  }
  .emp-info{flex:1; min-width:0;}
  .emp-name{font-size:15.5px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .emp-meta{font-size:12px; color:var(--ink-soft); margin-top:1px;}
  .emp-status{
    flex:0 0 auto; text-align:right; font-family:'IBM Plex Mono',monospace; font-size:12px;
  }
  .status-pill{
    display:inline-block; padding:3px 8px; border-radius:99px; font-size:11px;
    font-family:'IBM Plex Sans',sans-serif; font-weight:600; letter-spacing:.02em;
  }
  .status-pending{background:#F3E2D0; color:var(--amber-deep);}
  .status-logged{background:#DCEAE1; color:var(--green);}
  .logged-nums{margin-top:3px; color:var(--ink); font-size:12.5px;}
  .chevron{color:var(--ink-soft); font-size:18px; margin-left:2px;}

  /* ---- Entry panel (inline expand) ---- */
  .entry-panel{
    border-top:1px solid var(--line);
    background:#FAFAF9;
    padding:14px;
    display:none;
  }
  .entry-panel.open{display:block;}
  .field-row{display:flex; gap:10px; margin-bottom:10px;}
  .field{flex:1;}
  .field label{
    display:block; font-size:11px; text-transform:uppercase; letter-spacing:.06em;
    color:var(--ink-soft); margin-bottom:4px;
  }
  .field input, .field textarea{
    width:100%; border:1px solid var(--line); border-radius:var(--radius);
    padding:9px 10px; font-size:15px; background:#fff; color:var(--ink);
    font-family:'IBM Plex Mono',monospace;
  }
  .field textarea{font-family:'IBM Plex Sans',sans-serif; resize:vertical; min-height:52px;}
  .panel-actions{display:flex; gap:8px; margin-top:4px;}
  .btn{
    border:none; border-radius:var(--radius); padding:10px 16px; font-size:14px;
    font-family:'Barlow Condensed',sans-serif; font-weight:600; letter-spacing:.02em;
    cursor:pointer; text-transform:uppercase;
  }
  .btn-save{background:var(--amber); color:#241A08; flex:1;}
  .btn-save:active{background:var(--amber-deep);}
  .btn-cancel{background:#E7E9EB; color:var(--ink-soft);}
  .btn-clear{background:none; color:var(--red); text-decoration:underline; padding:10px 6px;}
  .save-flash{
    font-size:12px; color:var(--green); margin-top:6px; height:14px; font-family:'IBM Plex Mono',monospace;
  }

  .empty-state{
    text-align:center; padding:40px 20px; color:var(--ink-soft); font-size:14px;
  }

  /* ---- Export tab ---- */
  .export-wrap{padding:0 16px;}
  .export-summary{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px; margin-bottom:12px;
  }
  .export-summary .big{
    font-family:'Barlow Condensed',sans-serif; font-size:34px; font-weight:700; line-height:1;
  }
  .export-summary .cap{font-size:12px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em; margin-top:2px;}
  .export-actions{display:flex; gap:8px; margin-bottom:14px;}
  .export-actions .btn{flex:1;}
  .btn-primary{background:var(--ink); color:#fff;}
  .btn-primary:active{background:#000;}
  .export-table{width:100%; border-collapse:collapse; font-size:12.5px; background:var(--card); border:1px solid var(--line);}
  .export-table th, .export-table td{
    border-bottom:1px solid var(--line); padding:8px 8px; text-align:left; vertical-align:top;
  }
  .export-table th{
    font-family:'Barlow Condensed',sans-serif; font-size:12px; text-transform:uppercase;
    letter-spacing:.04em; color:var(--ink-soft); background:#F3F4F5;
  }
  .export-table td.num{font-family:'IBM Plex Mono',monospace;}
  .copy-toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#fff; padding:10px 18px; border-radius:var(--radius);
    font-size:13px; font-family:'IBM Plex Sans',sans-serif; opacity:0; pointer-events:none;
    transition:opacity .2s ease; z-index:50;
  }
  .copy-toast.show{opacity:1;}

  ::selection{background:var(--amber); color:#1C2024;}
</style>
</head>

    <div>

<div class="tabs">

<div class="controls" id="rosterControls">

  </select>

  </select>
</div>

<div class="list" id="rosterList"></div>

<div class="export-wrap" id="exportView" style="display:none;">

    <div class="cap">entries logged for selected date</div>
  </div>
  <div class="export-actions">
    <button class="btn btn-primary" id="copyBtn">Copy for Claude</button>

  <table class="export-table" id="exportTable">

    <tbody id="exportBody"></tbody>
  </table>
</div>

<div class="copy-toast" id="copyToast">Copied</div>

function todayStr(){
  const d = new Date();
  const off = d.getTimezoneOffset();
  const local = new Date(d.getTime() - off*60000);
  return local.toISOString().slice(0,10);
}

function storageKey(dateStr){ return 'entries-' + dateStr; }

  }catch(e){ /* not set yet */ }

async function loadEntries(dateStr, {silent}={}){

  }catch(e){

  }catch(e){ latest = {}; }
  latest[empId] = data;
  await window.storage.set(storageKey(currentDate), JSON.stringify(latest), true);
  entries = latest;
}

async function clearEntry(empId){
  let latest = {};
  try{
    const res = await window.storage.get(storageKey(currentDate), true);
    latest = (res && res.value) ? JSON.parse(res.value) : {};
  }catch(e){ latest = {}; }
  delete latest[empId];
  await window.storage.set(storageKey(currentDate), JSON.stringify(latest), true);
  entries = latest;
}

// ---------- rendering ----------
function renderRoster(){
  const list = document.getElementById('rosterList');
  const term = searchTerm.trim().toLowerCase();
  const filtered = ROSTER.filter(r=>{
    if(deptFilterVal && r.dept !== deptFilterVal) return false;
    if(shopFilterVal && r.shop !== shopFilterVal) return false;
    if(shiftFilterVal && String(r.shift) !== shiftFilterVal) return false;
    if(!term) return true;
    return r.name.toLowerCase().includes(term) || r.emp.includes(term);
  });

  const loggedCount = ROSTER.filter(r => entries[r.emp]).length;
  document.getElementById('progressLabel').textContent = loggedCount + ' / ' + ROSTER.length + ' logged';
  document.getElementById('progressFill').style.width = (ROSTER.length ? (loggedCount/ROSTER.length*100) : 0) + '%';

  if(filtered.length === 0){
    list.innerHTML = '<div class="empty-state">No employees match this search.</div>';
    return;
  }

  list.innerHTML = filtered.map(r=>{
    const e = entries[r.emp];
    const isOpen = openEmpId === r.emp;
    const statusHtml = e
      ? '<span class="status-pill status-logged">Logged</span><div class="logged-nums">' +
        esc(e.rate||'—') + ' → ' + esc(e.actual||'—') + '</div>'
      : '<span class="status-pill status-pending">Pending</span>';
    return (
      '<div class="emp-card" data-emp="'+r.emp+'">' +
        '<div class="emp-row" onclick="toggleEntry(\''+r.emp+'\')">' +
          '<div class="emp-id mono">#'+r.emp+'</div>' +
          '<div class="emp-info">' +
            '<div class="emp-name">'+esc(r.name)+'</div>' +
            '<div class="emp-meta">'+empMeta(r)+'</div>' +
          '</div>' +
          '<div class="emp-status">'+statusHtml+'</div>' +
          '<div class="chevron">'+(isOpen?'▾':'›')+'</div>' +
        '</div>' +
        (isOpen ? entryPanelHtml(r, e) : '') +
      '</div>'
    );
  }).join('');
}

function empMeta(r){
  const parts = [r.dept];
  if(r.shop && r.shop !== 'Unassigned') parts.push(r.shop);
  if(r.shift) parts.push('Shift ' + r.shift);
  return esc(parts.join(' · '));
}

function entryPanelHtml(r, e){
  const rate = e ? e.rate : '';
  const actual = e ? e.actual : '';
  const comments = e ? e.comments : '';
  return (
    '<div class="entry-panel open">' +
      '<div class="field-row">' +
        '<div class="field"><label>Current job rate</label>' +
          '<input inputmode="decimal" id="rate-'+r.emp+'" value="'+escAttr(rate)+'" placeholder="e.g. 45" /></div>' +
        '<div class="field"><label>Actual rate</label>' +
          '<input inputmode="decimal" id="actual-'+r.emp+'" value="'+escAttr(actual)+'" placeholder="e.g. 38" /></div>' +
      '</div>' +
      '<div class="field"><label>Comments</label>' +
        '<textarea id="comments-'+r.emp+'" placeholder="Notes, downtime, material issues...">'+esc(comments)+'</textarea></div>' +
      '<div class="panel-actions">' +
        '<button class="btn btn-cancel" onclick="event.stopPropagation();closeEntry()">Cancel</button>' +
        '<button class="btn btn-save" onclick="event.stopPropagation();doSave(\''+r.emp+'\')">Save</button>' +
        (e ? '<button class="btn-clear" onclick="event.stopPropagation();doClear(\''+r.emp+'\')">Clear</button>' : '') +
      '</div>' +
      '<div class="save-flash" id="flash-'+r.emp+'"></div>' +
    '</div>'
  );
}

function toggleEntry(empId){
  openEmpId = (openEmpId === empId) ? null : empId;
  renderRoster();
  if(openEmpId){
    setTimeout(()=>{
      const el = document.querySelector('[data-emp="'+CSS.escape(empId)+'"]');
      if(el) el.scrollIntoView({behavior:'smooth', block:'center'});
      const first = document.getElementById('rate-'+empId);
      if(first) first.focus();
    }, 30);
  }
}
function closeEntry(){ openEmpId = null; renderRoster(); }

async function doSave(empId){
  const rate = document.getElementById('rate-'+empId).value.trim();
  const actual = document.getElementById('actual-'+empId).value.trim();
  const comments = document.getElementById('comments-'+empId).value.trim();
  const initials = document.getElementById('initials').value.trim() || '—';
  const flash = document.getElementById('flash-'+empId);
  flash.textContent = 'Saving…';
  try{
    await saveEntry(empId, {rate, actual, comments, enteredBy: initials, updatedAt: new Date().toISOString()});
    openEmpId = null;
    renderRoster();
    renderExport();
  }catch(e){
    flash.textContent = 'Save failed — try again';
  }
}

async function doClear(empId){
  if(!confirm('Clear this entry?')) return;
  await clearEntry(empId);
  openEmpId = null;
  renderRoster();
  renderExport();
}

function renderExport(){
  const rows = ROSTER
    .filter(r => entries[r.emp])
    .map(r => ({r, e: entries[r.emp]}));
  document.getElementById('exportCount').textContent = rows.length;
  document.getElementById('exportBody').innerHTML = rows.map(({r,e})=>{
    return '<tr><td class="num">'+r.emp+'</td><td>'+esc(r.name)+'</td>' +
      '<td class="num">'+esc(e.rate||'')+'</td><td class="num">'+esc(e.actual||'')+'</td>' +
      '<td>'+esc(e.comments||'')+'</td><td class="num">'+esc(e.enteredBy||'')+'</td></tr>';
  }).join('') || '<tr><td colspan="6" style="color:#5B636B;">No entries yet for this date.</td></tr>';
}

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escAttr(s){ return esc(s); }

// ---------- events ----------
document.getElementById('searchInput').addEventListener('input', e=>{
  searchTerm = e.target.value; renderRoster();
});
shopFilter.addEventListener('change', e=>{
  shopFilterVal = e.target.value; renderRoster();
});
deptFilter.addEventListener('change', e=>{
  deptFilterVal = e.target.value; renderRoster();
});
shiftFilter.addEventListener('change', e=>{
  shiftFilterVal = e.target.value; renderRoster();
});
document.getElementById('prevDay').addEventListener('click', ()=> shiftDate(-1));
document.getElementById('nextDay').addEventListener('click', ()=> shiftDate(1));
dateInput.addEventListener('change', e=>{
  currentDate = e.target.value;
  openEmpId = null;
  loadEntries(currentDate);
});
function shiftDate(delta){
  const d = new Date(currentDate + 'T00:00:00');
  d.setDate(d.getDate()+delta);
  currentDate = d.toISOString().slice(0,10);
  dateInput.value = currentDate;
  openEmpId = null;
  loadEntries(currentDate);
}

document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const tab = btn.dataset.tab;
    document.getElementById('rosterControls').style.display = tab==='roster' ? 'flex':'none';
    document.getElementById('rosterList').style.display = tab==='roster' ? 'block':'none';
    document.getElementById('exportView').style.display = tab==='export' ? 'block':'none';
    if(tab==='export') renderExport();
  });
});

document.getElementById('copyBtn').addEventListener('click', async ()=>{
  const rows = ROSTER.filter(r => entries[r.emp]).map(r=>{
    const e = entries[r.emp];
    return [r.emp, r.name, e.rate||'', e.actual||'', (e.comments||'').replace(/\t/g,' '), e.enteredBy||''].join('\t');
  });
  const header = ['Emp#','Name','Current Job Rate','Actual Rate','Comments','Entered By'].join('\t');
  const text = 'Date: ' + currentDate + '\n' + header + '\n' + rows.join('\n');
  try{
    await navigator.clipboard.writeText(text);
    showToast('Copied — paste into your Claude chat');
  }catch(e){
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    showToast('Copied — paste into your Claude chat');
  }
});

document.getElementById('csvBtn').addEventListener('click', ()=>{
  const rows = ROSTER.filter(r => entries[r.emp]).map(r=>{
    const e = entries[r.emp];
    const esc = v => '"' + String(v==null?'':v).replace(/"/g,'""') + '"';
    return [r.emp, r.name, e.rate||'', e.actual||'', e.comments||'', e.enteredBy||''].map(esc).join(',');
  });
  const header = ['Emp#','Name','Current Job Rate','Actual Rate','Comments','Entered By'].map(v=>'"'+v+'"').join(',');
  const csv = header + '\n' + rows.join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'rate-entries-' + currentDate + '.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

let toastTimer;
function showToast(msg){
  const t = document.getElementById('copyToast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

// ---------- boot ----------
(async function boot(){
  await loadInitials();
  await loadEntries(currentDate);
  pollTimer = setInterval(()=>{
    if(openEmpId === null) loadEntries(currentDate, {silent:true});
  }, 20000);
})();
</script>
</body>
</html>
